
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review+ 評價研究所</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 網站標題 -->
    <header>
        <h1>Review+ 評價研究所</h1>
        <p>讓每一次購物，都有更好的參考依據</p>
    </header>

    <!-- 網站主要內容 -->
    <main>

        <section class="intro">
            <h2>買東西之前，先看看真實評價。</h2>

            <p>
                整合商品資訊、網紅推薦與消費者心得，
                協助使用者做出更適合自己的消費選擇。
            </p>

            <div class="product-preview">
                <p>商品評價展示圖片</p>
                <span>Review+ 商品資訊展示區</span>
            </div>
        </section>

        <!-- 資訊選擇區 -->
        <section class="choice">
            <h2>你購買商品時最重視什麼？</h2>

            <button id="influencerBtn">
                網紅推薦與開箱
            </button>

            <button id="consumerBtn">
                一般消費者真實評價
            </button>

            <p>選擇你想參考的商品資訊。</p>
        </section>

        <!-- 內容顯示區 -->
        <section id="result">
            <h2>歡迎來到 Review+</h2>
            <p>請選擇上方的資訊，查看不同的商品評價。</p>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
